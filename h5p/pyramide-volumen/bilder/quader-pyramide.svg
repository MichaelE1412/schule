</g>
<g stroke="#999" stroke-width="2" stroke-dasharray="7 6" fill="none"><line x1="230" y1="40" x2="230" y2="340"/><line x1="230" y1="340" x2="120" y2="420"/><line x1="230" y1="340" x2="530" y2="340"/></g>
