<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="Arial,Helvetica,sans-serif">
<rect width="640" height="480" fill="#fff"/>
<!-- A(80,410) B(400,410) C(540,300) D(220,300) M(310,355) S(310,70) -->
<polygon points="80,410 310,355 310,70" fill="#ffe08a" opacity="0.6"/>
<g stroke="#333" stroke-width="3" fill="none">
<line x1="80" y1="410" x2="400" y2="410"/><line x1="400" y1="410" x2="540" y2="300"/>
<line x1="400" y1="410" x2="310" y2="70"/><line x1="540" y1="300" x2="310" y2="70"/>
</g>
<g stroke="#333" stroke-width="2" stroke-dasharray="8 6" fill="none">
<line x1="80" y1="410" x2="220" y2="300"/><line x1="220" y1="300" x2="540" y2="300"/><line x1="220" y1="300" x2="310" y2="70"/>
</g>
<line x1="80" y1="410" x2="540" y2="300" stroke="#8e44ad" stroke-width="2" stroke-dasharray="4 5"/>
<line x1="80" y1="410" x2="310" y2="355" stroke="#2e8b57" stroke-width="4" stroke-dasharray="10 6"/>
<line x1="310" y1="355" x2="310" y2="70" stroke="#c0392b" stroke-width="4" stroke-dasharray="10 6"/>
<line x1="80" y1="410" x2="310" y2="70" stroke="#1f6fb2" stroke-width="4"/>
<polyline points="310,335 291,339 291,359" fill="none" stroke="#333" stroke-width="2"/>
<circle cx="310" cy="355" r="4" fill="#333"/>
<text x="320" y="220" font-size="26" fill="#c0392b" font-weight="bold">h</text>
<text x="160" y="220" font-size="26" fill="#1f6fb2" font-weight="bold">s</text>
<text x="170" y="372" font-size="22" fill="#2e8b57" font-weight="bold">d/2</text>
<text x="440" y="322" font-size="20" fill="#8e44ad">d</text>
<text x="230" y="448" font-size="26" fill="#333">a</text>
<text x="482" y="380" font-size="26" fill="#333">b</text>
<text x="20" y="40" font-size="22" fill="#333">Stützdreieck: h, s und d/2 (d = Diagonale der Grundfläche)</text>
<text x="20" y="472" font-size="18" fill="#555">erst d aus a und b, dann h aus s und d/2 · s ist die Hypotenuse</text>
</svg>
