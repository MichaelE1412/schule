<text x="480.0" y="345.0" font-size="22" fill="#d62839" text-anchor="middle" font-weight="bold" >v<tspan dx="-12.1" dy="-13.6" font-size="13.6">→</tspan><tspan dy="13.6" dx="0.9">​</tspan> = v<tspan dx="-12.1" dy="-13.6" font-size="13.6">→</tspan><tspan dy="13.6" dx="0.9">​</tspan><tspan dy="7.0" font-size="15.0">x</tspan><tspan dy="-7.0">​</tspan> + v<tspan dx="-12.1" dy="-13.6" font-size="13.6">→</tspan><tspan dy="13.6" dx="0.9">​</tspan><tspan dy="7.0" font-size="15.0">y</tspan><tspan dy="-7.0">​</tspan></text>
<text x="40.0" y="452.0" font-size="18" fill="#333" text-anchor="start" font-weight="normal" >Ansicht von oben. Stehen v<tspan dx="-9.9" dy="-11.2" font-size="11.2">→</tspan><tspan dy="11.2" dx="0.7">​</tspan><tspan dy="5.8" font-size="12.2">x</tspan><tspan dy="-5.8">​</tspan> und v<tspan dx="-9.9" dy="-11.2" font-size="11.2">→</tspan><tspan dy="11.2" dx="0.7">​</tspan><tspan dy="5.8" font-size="12.2">y</tspan><tspan dy="-5.8">​</tspan> senkrecht aufeinander, gilt v = √(v<tspan dy="5.8" font-size="12.2">x</tspan><tspan dy="-5.8">​</tspan>² + v<tspan dy="5.8" font-size="12.2">y</tspan><tspan dy="-5.8">​</tspan>²).</text>
