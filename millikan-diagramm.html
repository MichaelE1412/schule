<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hilfekarten Millikan-Diagramm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F4F9;
    --surface: #FFFFFF;
    --surface-2: #F6F8FC;
    --border: #DDE3EE;
    --text: #1B2433;
    --text-2: #56627A;
    --text-3: #8A94A8;
    --accent: #0073E6;
    --accent-hover: #005BB5;
    --accent-soft: #E6F0FC;
    --accent-ink: #FFFFFF;
    --wait: #B8C6DA;
    --shadow: 0 1px 2px rgba(20, 40, 80, 0.06), 0 8px 24px rgba(20, 40, 80, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0E1420;
      --surface: #161E2E;
      --surface-2: #1B2537;
      --border: #2A3549;
      --text: #E8EDF6;
      --text-2: #9DA9C0;
      --text-3: #647089;
      --accent: #4B9DF2;
      --accent-hover: #6FB1F5;
      --accent-soft: #1A2C47;
      --accent-ink: #0B1220;
      --wait: #33415A;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0E1420;
    --surface: #161E2E;
    --surface-2: #1B2537;
    --border: #2A3549;
    --text: #E8EDF6;
    --text-2: #9DA9C0;
    --text-3: #647089;
    --accent: #4B9DF2;
    --accent-hover: #6FB1F5;
    --accent-soft: #1A2C47;
    --accent-ink: #0B1220;
    --wait: #33415A;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 32px 18px 64px; }

  header { margin-bottom: 22px; }
  .kicker {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 8px;
  }
  h1 { font-size: 26px; font-weight: 700; margin: 0 0 10px; letter-spacing: -0.015em; text-wrap: balance; }
  .intro { margin: 0; color: var(--text-2); max-width: 60ch; }

  /* Auswahl der Stolperstelle */
  .picker {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin: 24px 0 18px;
  }
  .pick {
    font: inherit;
    text-align: left;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 2px;
    transition: border-color 0.2s, background-color 0.2s;
  }
  .pick:hover { border-color: var(--accent); }
  .pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pick-num {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    color: var(--text-3);
  }
  .pick-title { font-weight: 600; font-size: 14px; line-height: 1.35; }
  .pick[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
  }
  .pick[aria-pressed="true"] .pick-num { color: var(--accent); }

  /* Hilfekarte */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-head {
    padding: 18px 20px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }
  .card-head h2 { font-size: 17px; font-weight: 600; margin: 0; text-wrap: balance; }
  .progress {
    display: flex;
    gap: 5px;
    padding-top: 7px;
    flex-shrink: 0;
  }
  .progress span {
    width: 18px; height: 4px; border-radius: 2px;
    background: var(--border);
    transition: background-color 0.3s;
  }
  .progress span.on { background: var(--accent); }

  .hints { list-style: none; margin: 0; padding: 8px 20px 4px; }
  .hint {
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px dashed var(--border);
    animation: reveal 0.4s ease both;
  }
  .hint:last-child { border-bottom: none; }
  .hint-no {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 13px; font-weight: 600;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .hint-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 2px;
  }
  .hint-text { margin: 0; }
  .empty { color: var(--text-3); font-size: 14px; padding: 14px 0; }
  @keyframes reveal {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  .card-foot {
    padding: 16px 20px 20px;
    background: var(--surface-2);
    border-top: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 16px;
  }
  .next {
    position: relative;
    overflow: hidden;
    font: inherit;
    font-weight: 600;
    font-size: 15px;
    padding: 11px 20px;
    min-height: 44px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    font-variant-numeric: tabular-nums;
    transition: background-color 0.2s;
  }
  .next:hover:not(:disabled) { background: var(--accent-hover); }
  .next:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .next:disabled { cursor: not-allowed; }
  .next.waiting { background: var(--wait); color: var(--text); }
  .next .fill {
    position: absolute; inset: 0;
    background: var(--accent);
    transform-origin: left center;
    transform: scaleX(0);
    opacity: 0.35;
  }
  .next .lbl { position: relative; }
  .next.finished { background: var(--border); color: var(--text-3); }
  .status { font-size: 13px; color: var(--text-2); flex: 1; min-width: 180px; margin: 0; }

  footer {
    margin-top: 28px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    color: var(--text-3);
    text-align: center;
  }

  @media (max-width: 460px) {
    .picker { grid-template-columns: 1fr; }
    .next { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="kicker">Millikan-Versuch · Diagrammauswertung</p>
    <h1>Hilfekarten</h1>
    <p class="intro">Wählt die Stelle, an der ihr hängt, und deckt die Hinweise nacheinander auf. Nach jedem Hinweis habt ihr eine kurze Denkpause, bevor der nächste freigeschaltet wird.</p>
  </header>

  <div class="picker" role="group" aria-label="Stolperstelle wählen">
    <button class="pick" id="pick-g1" data-group="g1" aria-pressed="true">
      <span class="pick-num">Stolperstelle 1</span>
      <span class="pick-title">Warum ist eine Steigung der Trendlinie unsinnig?</span>
    </button>
    <button class="pick" id="pick-g2" data-group="g2" aria-pressed="false">
      <span class="pick-num">Stolperstelle 2</span>
      <span class="pick-title">Ein Muster in den Höhen der Punkte erkennen</span>
    </button>
  </div>

  <section class="card" aria-live="polite">
    <div class="card-head">
      <h2 id="card-title"></h2>
      <div class="progress" id="progress" aria-hidden="true"></div>
    </div>
    <ol class="hints" id="hints"></ol>
    <div class="card-foot">
      <button class="next" id="next" type="button"><span class="fill" id="fill"></span><span class="lbl" id="next-lbl">Hinweis 1 aufdecken</span></button>
      <p class="status" id="status"></p>
    </div>
  </section>

  
</div>

<script>
  // Denkpause zwischen zwei Hinweisen (in Sekunden)
  const COOLDOWN_SECONDS = 15;

  const groups = {
    g1: {
      title: "Warum ist eine Steigung der Trendlinie hier unsinnig?",
      hints: [
        "Überlegt: Was genau bedeutet die Position eines Punktes auf der x-Achse in eurem Diagramm?",
        "Wenn zwei Gruppen zufällig in einer anderen Reihenfolge fertig geworden wären – würde sich dann etwas an den q-Werten ändern?",
        "Die x-Achse zeigt nur, in welcher Reihenfolge Werte eingetragen wurden – das hat nichts mit der Physik des Tröpfchens zu tun. Eine Steigung würde bedeuten, dass q von dieser Reihenfolge abhängt."
      ]
    },
    g2: {
      title: "Ein Muster in den Höhen der Punkte erkennen",
      hints: [
        "Schaut euch nur die y-Werte an, ignoriert komplett, wo auf der x-Achse die Punkte liegen.",
        "Gibt es Punkte auf ganz unterschiedlichen x-Positionen, die trotzdem auf ähnlicher Höhe liegen?",
        "Bildet die Differenz zwischen zwei benachbarten „Höhenbändern“. Wiederholt das für ein zweites Paar. Was fällt an den beiden Differenzen auf?"
      ]
    }
  };

  // Fortschritt pro Stolperstelle: Anzahl aufgedeckter Hinweise und Zeitpunkt des letzten Aufdeckens
  const STORE_KEY = "millikan-hilfekarten";
  let state = { current: "g1", g1: { shown: 0, last: 0 }, g2: { shown: 0, last: 0 } };
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY));
    if (saved && saved.g1 && saved.g2) state = saved;
  } catch (e) {}
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  const el = {
    title: document.getElementById("card-title"),
    progress: document.getElementById("progress"),
    hints: document.getElementById("hints"),
    next: document.getElementById("next"),
    fill: document.getElementById("fill"),
    lbl: document.getElementById("next-lbl"),
    status: document.getElementById("status")
  };

  function remaining(g) {
    if (state[g].shown === 0) return 0;
    const left = COOLDOWN_SECONDS * 1000 - (Date.now() - state[g].last);
    return Math.max(0, left);
  }

  function fmt(ms) {
    const s = Math.ceil(ms / 1000);
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  function renderCard() {
    const g = state.current;
    const grp = groups[g];
    document.querySelectorAll(".pick").forEach(b =>
      b.setAttribute("aria-pressed", b.dataset.group === g ? "true" : "false"));
    el.title.textContent = grp.title;
    el.progress.innerHTML = grp.hints.map((_, i) =>
      '<span class="' + (i < state[g].shown ? "on" : "") + '"></span>').join("");
    el.hints.innerHTML = "";
    if (state[g].shown === 0) {
      el.hints.innerHTML = '<li class="empty">Noch kein Hinweis aufgedeckt. Probiert es zuerst selbst.</li>';
    }
    for (let i = 0; i < state[g].shown; i++) appendHint(i, false);
    tick();
  }

  function appendHint(i, animate) {
    const li = document.createElement("li");
    li.className = "hint";
    if (!animate) li.style.animation = "none";
    li.innerHTML = '<span class="hint-no">' + (i + 1) + '</span>' +
      '<div><span class="hint-label">Hinweis ' + (i + 1) + '</span><p class="hint-text"></p></div>';
    li.querySelector(".hint-text").textContent = groups[state.current].hints[i];
    el.hints.appendChild(li);
  }

  function tick() {
    const g = state.current;
    const total = groups[g].hints.length;
    const shown = state[g].shown;
    el.next.classList.remove("waiting", "finished");

    if (shown >= total) {
      el.next.disabled = true;
      el.next.classList.add("finished");
      el.fill.style.transform = "scaleX(0)";
      el.lbl.textContent = "Alle Hinweise aufgedeckt";
      el.status.textContent = "Mehr Hilfe gibt es hier nicht. Fragt bei Bedarf eure Lehrkraft.";
      return;
    }

    const left = remaining(g);
    if (left > 0) {
      el.next.disabled = true;
      el.next.classList.add("waiting");
      el.fill.style.transform = "scaleX(" + (1 - left / (COOLDOWN_SECONDS * 1000)) + ")";
      el.lbl.textContent = "Hinweis " + (shown + 1) + " in " + fmt(left);
      el.status.textContent = "Denkpause: Arbeitet erst mit Hinweis " + shown + " weiter.";
    } else {
      el.next.disabled = false;
      el.fill.style.transform = "scaleX(0)";
      el.lbl.textContent = "Hinweis " + (shown + 1) + " aufdecken";
      el.status.textContent = shown === 0
        ? total + " Hinweise, die nach und nach mehr verraten."
        : "Kommt ihr noch nicht weiter? Dann deckt den nächsten Hinweis auf.";
    }
  }

  el.next.addEventListener("click", () => {
    const g = state.current;
    if (state[g].shown >= groups[g].hints.length || remaining(g) > 0) return;
    if (state[g].shown === 0) el.hints.innerHTML = "";
    appendHint(state[g].shown, true);
    state[g].shown += 1;
    state[g].last = Date.now();
    save();
    el.progress.children[state[g].shown - 1].classList.add("on");
    tick();
  });

  document.querySelectorAll(".pick").forEach(b => b.addEventListener("click", () => {
    state.current = b.dataset.group;
    save();
    renderCard();
  }));

  renderCard();
  setInterval(tick, 250);
</script>
</body>
</html>
